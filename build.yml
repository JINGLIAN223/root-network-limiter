name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" 
          test -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" || { echo 'Android SDK not found'; exit 1; }
          echo "SDK path: ${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platforms" || true
          ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip -q RootNetworkLimiter-0.1-source.zip -d project
          ls project

      - name: Build Debug & Release APK
        working-directory: project
        run: gradle assembleDebug assembleRelease

      - name: Check generated APK files
        run: |
          echo "==== Debug目录 ===="
          ls -R project/app/build/outputs/apk/debug || echo "Debug目录不存在"
          echo "==== Release目录 ===="
          ls -R project/app/build/outputs/apk/release || echo "Release目录不存在"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RootNetworkLimiter-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload unsigned Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RootNetworkLimiter-release-unsigned-apk
          path: project/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
